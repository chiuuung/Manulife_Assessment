<div class="home-container">
    <mat-card class="welcome-card">
      <mat-card-header>
        <mat-card-title>Welcome to Portfolio Manager</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>Please login or register to access your portfolio.</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" (click)="navigateToLogin()">Login</button>
        <button mat-raised-button color="accent" (click)="navigateToRegister()">Register</button>
      </mat-card-actions>
    </mat-card>
  </div>
