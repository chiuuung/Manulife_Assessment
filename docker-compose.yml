version: "3.8"
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio_management
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/database_schema.sql:/docker-entrypoint-initdb.d/database_schema.sql

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./backend/.env:/usr/src/app/.env

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"